# Separate test configuration: no desktop services or session autostarts.
overview_style=1
overview_zoom=0.5
animations=1
animation_duration_move=250
# Workspace switch duration in milliseconds.
animation_duration_tag=500
tag_animation_direction=0
tag_animation_continuous=1
# Keep active empty workspaces; compact abandoned ones after arrival.
tag_gather=2
drag_tile_to_tile=1
drag_tile_small=0
border_px=2
no_border_when_single=0
tag_rule=id:*,layout_name:scroller

exec_once=foot
exec_once=foot
exec_once=foot

# Alt shortcuts avoid Niri's usual Super shortcuts.
bind=ALT,Return,spawn,foot
bind=ALT,q,killclient
bind=ALT,a,togglemaximizescreen
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down
bind=ALT+CTRL,Up,viewtoleft,0
bind=ALT+CTRL,Down,viewtoright,0
bind=ALT,o,toggleoverview
bind=ALT,Escape,quit
bind=ALT,d,setlayout,dwindle
bind=ALT,m,setlayout,monocle
bind=ALT,s,setlayout,scroller
bind=ALT,v,setlayout,vertical_scroller
bind=ALT,t,setlayout,tile
bind=ALT,1,view,1
bind=ALT,2,view,2
bind=ALT,3,view,3
bind=ALT,4,view,4
bind=ALT,5,view,5
bind=ALT,6,view,6
bind=ALT,7,view,7
bind=ALT,8,view,8
bind=ALT,9,view,9
bind=ALT+SHIFT,1,tag,1
bind=ALT+SHIFT,2,tag,2
bind=ALT+SHIFT,3,tag,3
bind=ALT+SHIFT,4,tag,4
bind=ALT+SHIFT,5,tag,5
bind=ALT+SHIFT,6,tag,6
bind=ALT+SHIFT,7,tag,7
bind=ALT+SHIFT,8,tag,8
bind=ALT+SHIFT,9,tag,9
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize

# Native Mango live gestures, also available inside overview.
gesture_live=1
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview
gesturebind=none,left,3,focusstack,next
gesturebind=none,right,3,focusstack,prev
gesturebind=none,up,3,viewtoright,0
gesturebind=none,down,3,viewtoleft,0
